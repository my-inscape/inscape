<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="INSCAPE">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>INSCAPE</title>
  <script src="inscape-api-config.js"></script>
  <script src="inscape-invite-db.js"></script>
  <script src="inscape-auth-mock.js"></script>
  <script src="inscape-auth.js"></script>
  <script src="inscape-data.js"></script>
  <script>
    (function () {
      if (window.INSCAPE_AUTH && INSCAPE_AUTH.isAuthenticated()) {
        INSCAPE_AUTH.redirectIfAuthenticated();
      }
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --void: #000000;
      --ink: rgba(236, 234, 230, 0.88);
      --ink-soft: rgba(236, 234, 230, 0.42);
      --ink-faint: rgba(236, 234, 230, 0.22);
      --gold: rgba(196, 165, 116, 0.72);
      --gold-line: rgba(196, 165, 116, 0.28);
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--void);
      color: var(--ink);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Hiragino Sans", serif;
      -webkit-font-smoothing: antialiased;
    }

    .lp-root {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem max(2.5rem, env(safe-area-inset-bottom));
      overflow: hidden;
    }

    .lp-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 20rem;
      text-align: center;
      gap: 0;
    }

    @keyframes fadeRise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      font-size: 0.92rem;
      font-weight: 400;
      letter-spacing: 0.62em;
      text-indent: 0.62em;
      color: var(--ink);
      margin-bottom: 2.25rem;
      animation: fadeRise 1.2s ease both;
    }

    .copy {
      width: 100%;
      max-width: 18rem;
      margin: 0 auto 2.5rem;
      animation: fadeRise 1.5s 0.15s ease both;
    }

    .copy-lead {
      font-size: 0.74rem;
      font-weight: 400;
      line-height: 1.95;
      letter-spacing: 0.14em;
      text-indent: 0.14em;
      color: var(--ink);
      margin-bottom: 1.35rem;
    }

    .copy-body {
      font-size: 0.66rem;
      font-weight: 300;
      line-height: 2.15;
      letter-spacing: 0.1em;
      text-indent: 0.1em;
      color: var(--ink-soft);
    }

    .gate-form {
      width: 100%;
      max-width: 17.5rem;
      animation: fadeRise 1.7s 0.35s ease both;
    }

    .code-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--gold-line);
      color: var(--ink);
      font-family: "Segoe UI", "Hiragino Sans", sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.28em;
      text-align: center;
      text-transform: uppercase;
      padding: 0.55rem 0.25rem;
      outline: none;
      margin-bottom: 1.1rem;
    }

    .code-input::placeholder {
      color: var(--ink-faint);
      letter-spacing: 0.18em;
      text-transform: none;
    }

    .enter-btn {
      display: block;
      width: 100%;
      background: transparent;
      border: 1px solid var(--gold-line);
      color: var(--gold);
      font-family: inherit;
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      padding: 0.72rem 1rem;
      cursor: pointer;
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .enter-btn:hover:not(:disabled) {
      background: rgba(196, 165, 116, 0.06);
      border-color: rgba(196, 165, 116, 0.45);
    }

    .enter-btn:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    .enter-btn.is-busy:disabled {
      opacity: 0.45;
      cursor: wait;
    }

    .gate-error {
      min-height: 1.2rem;
      margin-top: 0.85rem;
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      color: rgba(201, 122, 122, 0.85);
    }

    .waitlist {
      flex-shrink: 0;
      padding-top: 1rem;
      animation: fadeRise 2s 0.6s ease both;
    }

    .waitlist a {
      font-size: 0.58rem;
      letter-spacing: 0.14em;
      color: var(--ink-faint);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .waitlist a:hover {
      color: var(--ink-soft);
      border-bottom-color: rgba(236, 234, 230, 0.12);
    }
  </style>
</head>
<body>
  <div class="lp-root">
    <div class="lp-center">
      <h1 class="logo">INSCAPE</h1>
      <div class="copy">
        <p class="copy-lead">ようこそ、あなただけのアトリエへ。</p>
        <p class="copy-body">今日の色をひとつ残すたび、<br>世界にひとつだけの作品が少しずつ生まれていきます。</p>
      </div>

      <form class="gate-form" id="gate-form" autocomplete="off">
        <input
          class="code-input"
          id="invite-code"
          type="text"
          inputmode="text"
          enterkeyhint="go"
          autocapitalize="characters"
          autocorrect="off"
          spellcheck="false"
          maxlength="64"
          placeholder="招待コード"
          aria-label="招待コード"
        >
        <button class="enter-btn" type="submit" id="enter-btn">Enter（アトリエに入る）</button>
        <p class="gate-error" id="gate-error" role="alert"></p>
      </form>
    </div>

    <div class="waitlist">
      <a href="#" id="waitlist-link">先行アクセス（審査制）ウェイトリストに登録</a>
    </div>
  </div>

  <script>
    (function () {
      var form = document.getElementById('gate-form');
      var input = document.getElementById('invite-code');
      var btn = document.getElementById('enter-btn');
      var errEl = document.getElementById('gate-error');
      var submitting = false;

      function syncEnterButton() {
        var hasText = !!(input.value && input.value.trim());
        btn.disabled = submitting || !hasText;
        btn.classList.toggle('is-busy', submitting);
      }

      function submitGate() {
        if (submitting) return;
        errEl.textContent = '';
        var raw = input.value;
        if (!raw || !raw.trim()) {
          errEl.textContent = '招待コードを入力してください';
          syncEnterButton();
          return;
        }
        submitting = true;
        syncEnterButton();
        INSCAPE_AUTH.redeemInvite(raw).then(function () {
          window.location.href = INSCAPE_AUTH.appPath('atelier.html');
        }).catch(function (err) {
          errEl.textContent = err.message || '認証に失敗しました';
        }).finally(function () {
          submitting = false;
          syncEnterButton();
        });
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        submitGate();
      });

      input.addEventListener('input', syncEnterButton);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.keyCode === 13) {
          e.preventDefault();
          submitGate();
        }
      });

      syncEnterButton();

      document.getElementById('waitlist-link').addEventListener('click', function (e) {
        e.preventDefault();
        window.open('mailto:hello@my-inscape.com?subject=INSCAPE%20Waitlist', '_blank');
      });
    })();
  </script>
</body>
</html>
